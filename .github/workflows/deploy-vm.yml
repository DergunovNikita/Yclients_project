name: Test and Deploy VM

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: vm-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # No .env file exists in a fresh checkout, so config.py's fail-closed default would
      # otherwise treat this job as production and refuse to import.
      APP_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: python -m pytest -q

  # Mirrors the frontend half of scripts/check.sh. proxy-runtime.test.mjs is what stops a 13th Vercel
  # function (Hobby plan allows 12) from reaching main.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --ignore-scripts --audit=false

      - name: Run frontend tests
        working-directory: web
        run: npm test

      - name: Scan sources for auth tokens
        working-directory: web
        run: npm run scan:auth-tokens

      # The same build Vercel makes, for the nginx-served copy of the site: the API is same-origin under /api.
      # The optional VITE_* repository variables mirror the Vercel project's; unset they are empty, which the
      # sources read as "off".
      - name: Build
        working-directory: web
        env:
          VITE_API_BASE: /api
          VITE_DEMO_ORIGIN: ${{ vars.VITE_DEMO_ORIGIN }}
          VITE_DEMO_AUTOLOGIN: ${{ vars.VITE_DEMO_AUTOLOGIN }}
          VITE_PUBLIC_REGISTRATION: ${{ vars.VITE_PUBLIC_REGISTRATION }}
        run: npm run build

      - name: Scan build for auth tokens
        working-directory: web
        run: npm run scan:auth-build

      - name: Upload frontend build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          # "Re-run all jobs" uploads a second time into the same run; without this the name is already taken.
          overwrite: true
          retention-days: 7

  deploy-vm:
    name: Deploy VM
    runs-on: ubuntu-latest
    needs:
      - secrets-scan
      - test
      - frontend
    if: github.ref == 'refs/heads/main'
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      VM_SSH_PORT: ${{ secrets.VM_SSH_PORT || '22' }}
      VM_PROJECT_DIR: ${{ secrets.VM_PROJECT_DIR || '/opt/yclients_bi_system' }}
      VM_WEB_ROOT: ${{ secrets.VM_WEB_ROOT || '/var/www/yclients-app' }}
    steps:
      - name: Require VM deploy secrets
        if: env.VM_HOST == '' || env.VM_USER == '' || env.VM_SSH_KEY == ''
        run: |
          echo "VM deploy secrets are not configured; refusing to report a successful production deploy." >&2
          exit 1

      - name: Configure SSH
        if: env.VM_HOST != '' && env.VM_USER != '' && env.VM_SSH_KEY != ''
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/vm_deploy_key
          chmod 600 ~/.ssh/vm_deploy_key
          # ssh-keyscan default timeout is 5s and it exits non-zero when KEX
          # doesn't finish in time — this is flaky against sshd under rate-limit
          # or first-request warmup. Retry with an explicit timeout and key type
          # list; treat a genuinely unreachable host as the follow-up ssh step's
          # concern so we get a clearer error there instead of exit 1 here.
          ssh-keyscan -p "$VM_SSH_PORT" -T 15 -t rsa,ecdsa,ed25519 "$VM_HOST" \
            >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy backend on VM
        if: env.VM_HOST != '' && env.VM_USER != '' && env.VM_SSH_KEY != ''
        run: |
          set +e
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/vm_deploy_key -p "$VM_SSH_PORT" "$VM_USER@$VM_HOST" \
            'sudo systemctl start yclients-auto-deploy.service'
          deploy_status=$?
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/vm_deploy_key -p "$VM_SSH_PORT" "$VM_USER@$VM_HOST" \
            'sudo journalctl -u yclients-auto-deploy.service -n 120 --no-pager'
          exit "$deploy_status"

      # A first full historical pass runs for hours and prints nothing while it pages
      # the YClients API. Tethered to this SSH session it died on an idle disconnect
      # (Broken pipe, exit 255) after 2 of 6 branches, leaving the history half-loaded
      # while the job still reported success. Launch it detached instead: the sync
      # outlives both this step and the connection, and a launch failure is now
      # visible rather than swallowed by continue-on-error.
      - name: Launch post-deploy sync (detached on VM)
        if: env.VM_HOST != '' && env.VM_USER != '' && env.VM_SSH_KEY != '' && env.VM_PROJECT_DIR != ''
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/vm_deploy_key -p "$VM_SSH_PORT" \
            "$VM_USER@$VM_HOST" bash -s -- "$VM_PROJECT_DIR" "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          project_dir="$1"
          sha="$2"
          cd "$project_dir"
          # Fail loudly on a missing tool. Backgrounding the launch instead would let
          # `set -e` miss the error and report a sync that never actually started.
          command -v setsid >/dev/null || { echo 'setsid is unavailable on the VM' >&2; exit 1; }
          command -v docker >/dev/null || { echo 'docker is unavailable on the VM' >&2; exit 1; }
          mkdir -p logs
          log_path="logs/post_deploy_sync_${sha}.log"
          # --fork makes setsid detach and return regardless of whether it already is a
          # process group leader; without it setsid execs and blocks this step for hours.
          setsid --fork nohup docker compose --profile tools run --rm sync \
            >"$log_path" 2>&1 </dev/null
          echo "Sync launched detached."
          echo "This job does not wait for it — a green deploy does not mean the sync finished."
          echo "Follow on the VM: tail -f ${project_dir}/${log_path}"
          REMOTE

      # Static files of the nginx-served site. They go last: the API they talk to is already deployed, and a
      # failure here must not stop the sync launch above. A VM without the web root has not been set up for
      # serving the site yet (Vercel still serves it), so that is a notice, not a failure.
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist

      - name: Publish frontend release on VM
        if: env.VM_HOST != '' && env.VM_USER != '' && env.VM_SSH_KEY != ''
        run: |
          set -euo pipefail
          ssh_vm() {
            ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/vm_deploy_key -p "$VM_SSH_PORT" "$VM_USER@$VM_HOST" "$@"
          }
          # `test -d` answers 1 for a missing directory; any other failure (ssh itself exits 255) is a real error
          # and must not read as "not set up yet".
          status=0
          ssh_vm "test -d '$VM_WEB_ROOT'" || status=$?
          if [ "$status" -eq 1 ]; then
            echo "::notice::No web root on the VM; frontend release skipped."
            exit 0
          elif [ "$status" -ne 0 ]; then
            echo "::error::Could not check the web root on the VM (exit $status)."
            exit "$status"
          fi
          release="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::8}"
          # Unpacked into a dot-directory that rotation and nginx never look at; it becomes a release only whole.
          partial="$VM_WEB_ROOT/releases/.incoming-$release"
          tar -C web-dist -czf - . | ssh_vm "rm -rf '$partial' && mkdir -p '$partial' && tar -xzf - -C '$partial'"
          ssh_vm bash -s -- "$VM_WEB_ROOT" "$release" "$VM_PROJECT_DIR" <<'REMOTE'
          set -euo pipefail
          umask 022
          web_root="$1"
          release="$2"
          project_dir="$3"
          keep=5
          partial="$web_root/releases/.incoming-$release"
          target="$web_root/releases/$release"
          [ -f "$partial/index.html" ] || { echo "Release has no index.html" >&2; exit 1; }
          chmod -R a+rX "$partial"
          mv "$partial" "$target"
          # Atomic switch: nginx resolves the symlink per request, so no reload and no half-copied state.
          ln -sfn "releases/$release" "$web_root/current.new"
          mv -Tf "$web_root/current.new" "$web_root/current"
          # Runs are serialised by the workflow's concurrency group, so leftovers of failed uploads are nobody's.
          rm -rf "$web_root"/releases/.incoming-*
          # The release just switched to is never rotated out, whatever its name sorts like.
          ls -1d "$web_root"/releases/*/ | { grep -vxF "$target/" || true; } | sort -r | tail -n +"$keep" | xargs -r rm -rf
          echo "Frontend release $release is live; kept: $(ls -1 "$web_root/releases" | tr '\n' ' ')"
          # The nginx copy of the proxy allowlist is installed by hand (it needs root); a route added to
          # api/_proxy.js is a 404 on the nginx-served site until it is refreshed and nginx is reloaded.
          installed=/etc/nginx/yclients-api-allowlist.conf
          shipped="$project_dir/deploy/nginx/api-allowlist.conf"
          if [ -f "$installed" ] && [ -f "$shipped" ] && ! cmp -s "$installed" "$shipped"; then
            echo "::warning::$installed differs from $shipped: install it and reload nginx (RUNBOOK-vm-frontend)."
          fi
          REMOTE
