name: Test and Deploy VM

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: vm-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  deploy-vm:
    name: Deploy VM
    runs-on: ubuntu-latest
    needs:
      - secrets-scan
      - test
    if: github.ref == 'refs/heads/main'
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      VM_SSH_PORT: ${{ secrets.VM_SSH_PORT || '22' }}
      VM_PROJECT_DIR: ${{ secrets.VM_PROJECT_DIR || '/opt/yclients_bi_system' }}
    steps:
      - name: Require VM deploy secrets
        if: env.VM_HOST == '' || env.VM_USER == '' || env.VM_SSH_KEY == ''
        run: |
          echo "VM deploy secrets are not configured; refusing to report a successful production deploy." >&2
          exit 1

      - name: Configure SSH
        if: env.VM_HOST != '' && env.VM_USER != '' && env.VM_SSH_KEY != ''
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/vm_deploy_key
          chmod 600 ~/.ssh/vm_deploy_key
          # ssh-keyscan default timeout is 5s and it exits non-zero when KEX
          # doesn't finish in time — this is flaky against sshd under rate-limit
          # or first-request warmup. Retry with an explicit timeout and key type
          # list; treat a genuinely unreachable host as the follow-up ssh step's
          # concern so we get a clearer error there instead of exit 1 here.
          ssh-keyscan -p "$VM_SSH_PORT" -T 15 -t rsa,ecdsa,ed25519 "$VM_HOST" \
            >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy backend on VM
        if: env.VM_HOST != '' && env.VM_USER != '' && env.VM_SSH_KEY != ''
        run: |
          set +e
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/vm_deploy_key -p "$VM_SSH_PORT" "$VM_USER@$VM_HOST" \
            'sudo systemctl start yclients-auto-deploy.service'
          deploy_status=$?
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/vm_deploy_key -p "$VM_SSH_PORT" "$VM_USER@$VM_HOST" \
            'sudo journalctl -u yclients-auto-deploy.service -n 120 --no-pager'
          exit "$deploy_status"

      # A first full historical pass runs for hours and prints nothing while it pages
      # the YClients API. Tethered to this SSH session it died on an idle disconnect
      # (Broken pipe, exit 255) after 2 of 6 branches, leaving the history half-loaded
      # while the job still reported success. Launch it detached instead: the sync
      # outlives both this step and the connection, and a launch failure is now
      # visible rather than swallowed by continue-on-error.
      - name: Launch post-deploy sync (detached on VM)
        if: env.VM_HOST != '' && env.VM_USER != '' && env.VM_SSH_KEY != '' && env.VM_PROJECT_DIR != ''
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/vm_deploy_key -p "$VM_SSH_PORT" \
            "$VM_USER@$VM_HOST" bash -s -- "$VM_PROJECT_DIR" "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          project_dir="$1"
          sha="$2"
          cd "$project_dir"
          # Fail loudly on a missing tool. Backgrounding the launch instead would let
          # `set -e` miss the error and report a sync that never actually started.
          command -v setsid >/dev/null || { echo 'setsid is unavailable on the VM' >&2; exit 1; }
          command -v docker >/dev/null || { echo 'docker is unavailable on the VM' >&2; exit 1; }
          mkdir -p logs
          log_path="logs/post_deploy_sync_${sha}.log"
          # --fork makes setsid detach and return regardless of whether it already is a
          # process group leader; without it setsid execs and blocks this step for hours.
          setsid --fork nohup docker compose --profile tools run --rm sync \
            >"$log_path" 2>&1 </dev/null
          echo "Sync launched detached."
          echo "This job does not wait for it — a green deploy does not mean the sync finished."
          echo "Follow on the VM: tail -f ${project_dir}/${log_path}"
          REMOTE
