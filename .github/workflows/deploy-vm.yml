name: Test and Deploy VM

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: vm-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  deploy-vm:
    name: Deploy VM
    runs-on: ubuntu-latest
    needs:
      - secrets-scan
      - test
    if: github.ref == 'refs/heads/main'
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      VM_SSH_PORT: ${{ secrets.VM_SSH_PORT || '22' }}
      VM_PROJECT_DIR: ${{ secrets.VM_PROJECT_DIR || '/opt/yclients_bi_system' }}
    steps:
      - name: Skip deploy when VM secrets are missing
        if: env.VM_HOST == '' || env.VM_USER == '' || env.VM_SSH_KEY == ''
        run: echo "VM deploy secrets are not configured; skipping deploy."

      - name: Configure SSH
        if: env.VM_HOST != '' && env.VM_USER != '' && env.VM_SSH_KEY != ''
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/vm_deploy_key
          chmod 600 ~/.ssh/vm_deploy_key
          # ssh-keyscan default timeout is 5s and it exits non-zero when KEX
          # doesn't finish in time — this is flaky against sshd under rate-limit
          # or first-request warmup. Retry with an explicit timeout and key type
          # list; treat a genuinely unreachable host as the follow-up ssh step's
          # concern so we get a clearer error there instead of exit 1 here.
          ssh-keyscan -p "$VM_SSH_PORT" -T 15 -t rsa,ecdsa,ed25519 "$VM_HOST" \
            >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy backend on VM
        if: env.VM_HOST != '' && env.VM_USER != '' && env.VM_SSH_KEY != ''
        run: |
          set +e
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/vm_deploy_key -p "$VM_SSH_PORT" "$VM_USER@$VM_HOST" \
            'sudo systemctl start yclients-auto-deploy.service'
          deploy_status=$?
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/vm_deploy_key -p "$VM_SSH_PORT" "$VM_USER@$VM_HOST" \
            'sudo journalctl -u yclients-auto-deploy.service -n 120 --no-pager'
          exit "$deploy_status"

      - name: Post-deploy incremental sync
        if: env.VM_HOST != '' && env.VM_USER != '' && env.VM_SSH_KEY != '' && env.VM_PROJECT_DIR != ''
        continue-on-error: true
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/vm_deploy_key -p "$VM_SSH_PORT" "$VM_USER@$VM_HOST" \
            "cd \"$VM_PROJECT_DIR\" && docker compose --profile tools run --rm sync"

      - name: Post-deploy Google Sheets import
        if: env.VM_HOST != '' && env.VM_USER != '' && env.VM_SSH_KEY != '' && env.VM_PROJECT_DIR != ''
        continue-on-error: true
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/vm_deploy_key -p "$VM_SSH_PORT" "$VM_USER@$VM_HOST" \
            "cd \"$VM_PROJECT_DIR\" && docker compose --profile tools run --rm import-sheets"
