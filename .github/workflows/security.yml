name: Security Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Run pip-audit
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off --format json --output pip-audit.json

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit.json

  frontend-dependency-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run npm audit
        working-directory: web
        run: |
          npm ci --ignore-scripts --audit=false
          set +e
          npm audit --audit-level=high --json > ../npm-audit.json
          audit_status=$?
          set -e
          cat ../npm-audit.json
          if [ "$audit_status" -gt 1 ]; then
            echo "npm audit failed before producing a vulnerability report" >&2
            exit "$audit_status"
          fi
          node scripts/audit-gate.mjs ../npm-audit.json audit-allowlist.json

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json

  static-analysis:
    name: Static security analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run Semgrep
        run: |
          python -m pip install semgrep
          semgrep scan \
            --config p/python \
            --config p/javascript \
            --config p/security-audit \
            --sarif \
            --output semgrep.sarif

      - name: Upload Semgrep SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif

      - name: Upload Semgrep artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif

  iac-security:
    name: IaC and workflow security
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run Checkov
        run: |
          python -m pip install checkov
          checkov \
            -d . \
            --framework dockerfile,github_actions,secrets \
            --soft-fail \
            --output cli \
            --output sarif \
            --output-file-path console,checkov.sarif

      - name: Upload Checkov SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov.sarif

      - name: Upload Checkov artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-sarif
          path: checkov.sarif
