# Security headers of the statically served SPA. Included in the site's server {} context (no hosts in this file).
# `script-src 'self'` is only safe while no page runs inline code: web/tests/csp-script-src.test.mjs guards both halves.
#
# nginx inherits add_header only into locations that declare none of their own: a location that sets add_header
# must include this file itself. The API locations do not: the API sends its own, stricter headers.
#
# Strict-Transport-Security is not here: it depends on the certificate lifecycle and stays in the site config.
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; script-src 'self'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
