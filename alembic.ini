[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Deliberately unusable: database.py / scripts.bootstrap_db always set the real URL from config.py.
# A bare `alembic` CLI must fail here rather than reach whatever listens on localhost:5432.
sqlalchemy.url = driver://set-by-database.py/

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
