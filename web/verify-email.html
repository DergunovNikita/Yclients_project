<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Подтверждение email — Salon Analytics</title>
  <link rel="stylesheet" href="/src/auth.css" />
</head>
<body class="auth-page auth-page--verify">
  <div class="auth-layout">
    <aside class="auth-brand">
      <div class="auth-brand__logo">
        <span class="auth-brand__mark" data-i18n="brand.mark">S</span>
        <span data-i18n="brand.name">Salon Analytics</span>
      </div>
      <div class="auth-brand__content">
        <h2 data-i18n="verify.aside.title">Подтверждение email</h2>
        <p data-i18n="verify.aside.subtitle">Это нужно один раз, чтобы защитить ваш аккаунт и включить вход в систему.</p>
      </div>
    </aside>

    <main class="auth-panel">
      <section class="auth-card">
        <div class="auth-mobile-logo">
          <span class="auth-brand__mark" data-i18n="brand.mark">S</span>
          <span data-i18n="brand.name">Salon Analytics</span>
        </div>
        <span class="auth-card__eyebrow" data-i18n="verify.eyebrow">Почта</span>
        <h1 data-i18n="verify.title">Подтверждаем email</h1>
        <p class="auth-subhead" data-i18n="verify.subhead">Пожалуйста, подождите — проверяем ссылку из письма…</p>

        <div class="auth-lang" id="lang-switcher"></div>

        <div class="alert error" id="error" hidden></div>
        <div class="alert success" id="success" hidden></div>

        <p class="auth-links">
          <a href="/login.html" data-i18n="verify.back">Перейти ко входу</a>
        </p>
      </section>
    </main>
  </div>
  <script type="module" src="/src/verify-email.js"></script>
</body>
</html>
