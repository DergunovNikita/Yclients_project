<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Area personale — Salon Analytics</title>
  <link rel="stylesheet" href="/src/auth.css" />
</head>
<body class="admin-page profile-page">
  <header class="admin-topbar">
    <div class="admin-topbar__brand">
      <span class="admin-topbar__brand-mark" data-i18n="brand.mark">S</span>
      <span data-i18n="brand.name">Salon Analytics</span>
    </div>
    <div class="admin-topbar__nav">
      <div class="auth-lang" id="lang-switcher"></div>
      <button type="button" class="btn btn--ghost" id="back-dashboard" data-i18n="common.toDashboard">Alla dashboard</button>
    </div>
  </header>

  <main class="admin-shell profile-shell">
    <section class="profile-card">
      <div class="profile-card__top">
        <div class="profile-card__avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M5 20c0-3.3 3.1-5 7-5s7 1.7 7 5"></path>
          </svg>
        </div>
        <button type="button" class="btn btn--danger btn--sm profile-card__logout" id="logout" data-i18n="profile.logout">Esci dall'account</button>
      </div>
      <span class="auth-card__eyebrow" data-i18n="profile.eyebrow">Area personale</span>
      <div class="profile-card__identity">
        <div class="profile-card__identity-text">
          <h1 id="profile-name" data-i18n="profile.greeting">Ciao</h1>
          <p class="auth-subhead" id="profile-email"></p>
          <p class="profile-card__role" id="profile-role"></p>
        </div>
        <button type="button" class="btn btn--ghost btn--sm profile-card__change-password" id="open-change-password" data-i18n="profile.changePassword">Cambia password</button>
      </div>

      <div class="profile-card__actions">
        <a href="/settings.html" class="btn btn--ghost" data-i18n="profile.settingsLink">Impostazioni e integrazioni</a>
        <a href="/admin.html" class="btn btn--ghost" id="manage-users" hidden data-i18n="profile.manageUsers">Gestione utenti</a>
      </div>
    </section>
  </main>

  <div class="admin-modal" id="change-password-modal" hidden>
    <div class="admin-modal__backdrop" data-close-modal="change-password"></div>
    <div class="admin-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="change-password-title">
      <header class="admin-modal__header">
        <h2 id="change-password-title" data-i18n="profile.modalTitle">Cambio password</h2>
        <button type="button" class="admin-modal__close" id="close-change-password" data-i18n-attr="aria-label:common.close">×</button>
      </header>
      <div class="alert error" id="password-error" hidden></div>
      <div class="alert success" id="password-success" hidden></div>
      <form id="change-password-form" class="admin-toolbar admin-toolbar--create profile-password__form">
        <label><span data-i18n="profile.currentPassword">Password attuale</span><input type="password" id="current-password" required minlength="1" autocomplete="current-password" /></label>
        <label><span data-i18n="profile.newPassword">Nuova password</span><input type="password" id="new-password" required minlength="8" autocomplete="new-password" placeholder="almeno 8 caratteri" data-i18n-attr="placeholder:profile.newPasswordPlaceholder" /></label>
        <label><span data-i18n="profile.confirmPassword">Ripeti la nuova password</span><input type="password" id="confirm-password" required minlength="8" autocomplete="new-password" /></label>
        <div class="admin-modal__actions">
          <button type="button" class="btn btn--ghost" id="cancel-change-password" data-i18n="common.cancel">Annulla</button>
          <button type="submit" class="btn btn--primary" id="change-password-btn" data-i18n="profile.submit">Cambia password</button>
        </div>
      </form>
    </div>
  </div>
  <script type="module" src="/src/profile.js"></script>
</body>
</html>
