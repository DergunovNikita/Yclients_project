<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password dimenticata? — Salon Analytics</title>
  <link rel="stylesheet" href="/src/auth.css" />
</head>
<body class="auth-page auth-page--forgot">
  <div class="auth-layout">
    <aside class="auth-brand">
      <div class="auth-brand__logo">
        <span class="auth-brand__mark" data-i18n="brand.mark">S</span>
        <span data-i18n="brand.name">Salon Analytics</span>
      </div>
      <div class="auth-brand__content">
        <h2 data-i18n="forgot.aside.title">Recupera l'accesso</h2>
        <p data-i18n="forgot.aside.subtitle">Ti invieremo un link monouso via email. Il link è valido per un tempo limitato.</p>
      </div>
    </aside>

    <main class="auth-panel">
      <section class="auth-card">
        <div class="auth-mobile-logo">
          <span class="auth-brand__mark" data-i18n="brand.mark">S</span>
          <span data-i18n="brand.name">Salon Analytics</span>
        </div>
        <span class="auth-card__eyebrow" data-i18n="forgot.eyebrow">Sicurezza</span>
        <h1 data-i18n="forgot.title">Password dimenticata?</h1>
        <p class="auth-subhead" data-i18n="forgot.subhead">Inserisci l'email del tuo account — se esiste, ti invieremo un link per il reset.</p>

        <div class="auth-lang" id="lang-switcher"></div>

        <div class="alert error" id="error" hidden></div>
        <div class="alert success" id="success" hidden></div>

        <form class="auth-form" id="auth-form">
          <div class="field">
            <label for="email" data-i18n="common.email">Email</label>
            <input type="email" id="email" required autocomplete="username" placeholder="nome@azienda.com" data-i18n-attr="placeholder:login.emailPlaceholder" />
          </div>
          <button type="submit" class="btn btn--primary" id="submit" data-i18n="forgot.submit">Invia il link</button>
        </form>

        <p class="auth-links">
          <a href="/login.html" data-i18n="forgot.back">Torna all'accesso</a>
        </p>
      </section>
    </main>
  </div>
  <script type="module" src="/src/forgot-password.js"></script>
</body>
</html>
