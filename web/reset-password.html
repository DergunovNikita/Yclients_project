<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Новый пароль — Salon Analytics</title>
  <link rel="stylesheet" href="/src/auth.css" />
</head>
<body class="auth-page auth-page--reset">
  <div class="auth-layout">
    <aside class="auth-brand">
      <div class="auth-brand__logo">
        <span class="auth-brand__mark" data-i18n="brand.mark">S</span>
        <span data-i18n="brand.name">Salon Analytics</span>
      </div>
      <div class="auth-brand__content">
        <h2 data-i18n="reset.aside.title">Новый пароль</h2>
        <p data-i18n="reset.aside.subtitle">Выберите надёжный пароль, который не используете на других сайтах.</p>
      </div>
    </aside>

    <main class="auth-panel">
      <section class="auth-card">
        <div class="auth-mobile-logo">
          <span class="auth-brand__mark" data-i18n="brand.mark">S</span>
          <span data-i18n="brand.name">Salon Analytics</span>
        </div>
        <span class="auth-card__eyebrow" data-i18n="reset.eyebrow">Сброс пароля</span>
        <h1 data-i18n="reset.title">Задайте новый пароль</h1>
        <p class="auth-subhead" data-i18n="reset.subhead">После сохранения вы сможете войти с новыми данными.</p>

        <div class="auth-lang" id="lang-switcher"></div>

        <div class="alert error" id="error" hidden></div>
        <div class="alert success" id="success" hidden></div>

        <form class="auth-form" id="auth-form">
          <div class="field">
            <label for="password" data-i18n="reset.passwordLabel">Новый пароль</label>
            <input type="password" id="password" required minlength="8" autocomplete="new-password" placeholder="Не менее 8 символов" data-i18n-attr="placeholder:reset.passwordPlaceholder" />
          </div>
          <button type="submit" class="btn btn--primary" id="submit" data-i18n="reset.submit">Сохранить пароль</button>
        </form>
      </section>
    </main>
  </div>
  <script type="module" src="/src/reset-password.js"></script>
</body>
</html>
