x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
    args:
      APP_REVISION: ${APP_REVISION:-local}
  image: yclients_bi_system-app:local
  env_file:
    - .env
  environment:
    APP_ENV: ${APP_ENV:-production}
    DB_HOST: postgres
    DB_PORT: 5432
  volumes:
    - ./logs:/app/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    # The image ships stock defaults, which meant shared_buffers=128MB against a pg_data
    # volume of ~640MB -- the working set could not stay resident, so the dashboard's repeated
    # scans of the same fact tables kept going back to the page cache. 1GB holds the whole
    # database with headroom; more would be spent on nothing, since there is not more database
    # to cache. It is also ~13% of the VM's 7.9GB rather than the usual 25% rule (~2GB),
    # deliberately: this box has NO SWAP and also runs the api, the worker and a second demo
    # stack, so over-committing is an OOM kill rather than a slowdown.
    # `postgres` must lead the list -- this replaces the image's CMD, and the entrypoint
    # expects the server command as its arguments. Verified booting with this exact flag on
    # postgres:16-alpine before it was applied here.
    command: ["postgres", "-c", "shared_buffers=1GB"]
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-yclients_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    <<: *app-base
    command: ["api"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    <<: *app-base
    command: ["worker"]
    restart: unless-stopped

  migrate:
    <<: *app-base
    command: ["migrate"]
    restart: "no"

  sync:
    <<: *app-base
    profiles: ["tools"]
    entrypoint: ["/app/docker/entrypoint.sh", "sync"]
    command: ["--mode", "incremental", "--trigger", "manual", "--initiator", "docker"]
    restart: "no"

  nginx:
    image: nginx:alpine
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    profiles: ["prod"]
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - certbot_data:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  pg_data:
  certbot_data:
