line-length = 120

[lint]
# Ruff's defaults (E4, E7, E9, F), the line-length rule AGENTS.md states, and DTZ005: stored
# timestamps are naive UTC from clock.utcnow(), a bare datetime.now() or date.today() would take the host's local time.
extend-select = ["E501", "DTZ005", "DTZ011"]

[lint.per-file-ignores]
# Names a log file after the local wall clock and stores nothing.
"sync_logging.py" = ["DTZ005"]
# Fixtures that compare against a "today" the code under test also reads from the host.
"tests/*" = ["DTZ011"]
